name: deploy

# one target only: every push to main that touches the web app builds :prod and deploys it.
# same shape as aracari: build on GitHub's hardware, pull and restart on the home server.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/README.md'
      - '!web/deploy/**'
      - '.github/workflows/deploy.yml'

# never run two deploys at once
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/skoop-ksm/timecard
  TARGET: prod
  SERVICE: timecard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node test/run.js
        working-directory: web

  # build on GitHub's hardware and push to GHCR
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TARGET }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # pull and restart on the home server (self-hosted runner registered to this repo, label "timecard")
  deploy:
    needs: build
    runs-on: [self-hosted, timecard]
    timeout-minutes: 15
    # this job only reads from GHCR; the build job is the one that pushes
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # keep the image that is serving right now under a name of its own, so there is something
      # to go back to when the new one doesn't come up
      - name: Keep the running image as a rollback target
        run: |
          cd /srv/timecard
          current=$(docker compose images -q "$SERVICE" || true)
          if [ -n "$current" ]; then
            docker tag "$current" "$IMAGE:$TARGET-prev"
            echo "rollback target: $current"
          else
            echo "nothing running yet, no rollback target"
          fi

      - name: Pull and restart
        run: |
          cd /srv/timecard
          docker compose pull "$SERVICE"
          docker compose up -d "$SERVICE"

      - name: Wait for healthy
        run: |
          cd /srv/timecard
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$SERVICE")")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "container did not become healthy" && docker compose logs --tail 50 "$SERVICE" && exit 1

      # the new image never became healthy: put the old one back rather than leaving a crash loop
      # serving the site. the next deploy pulls again, so this is a hold, not a pin
      - name: Roll back
        if: failure()
        run: |
          cd /srv/timecard
          if docker image inspect "$IMAGE:$TARGET-prev" >/dev/null 2>&1; then
            docker tag "$IMAGE:$TARGET-prev" "$IMAGE:$TARGET"
            docker compose up -d --no-deps "$SERVICE"
            echo "rolled back to the previous image"
          else
            echo "no previous image to roll back to"
          fi

      # dangling layers only; the :prod-prev tag above is what keeps the rollback target alive
      - name: Prune dangling layers
        run: docker image prune -f
